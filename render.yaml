services:
  - type: web
    name: polyguard-api
    runtime: python
    rootDir: webapp
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install torch --index-url https://download.pytorch.org/whl/cpu
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: POLYGUARD_ALLOWED_ORIGINS
        value: https://polyguard-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173

  - type: web
    name: polyguard-frontend
    runtime: static
    rootDir: webapp/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://polyguard-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
